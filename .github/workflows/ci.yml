name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --no-check-all --no-check-publish

      - name: Install dependencies (from Packagist)
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Test (phpunit if scaffolded, else autoload check)
        run: |
          if [ -x vendor/bin/phpunit ] && { [ -f phpunit.xml ] || [ -f phpunit.xml.dist ]; }; then
            vendor/bin/phpunit
          else
            echo "No standalone phpunit suite; verifying autoload."
            php -r "require 'vendor/autoload.php'; echo 'autoload OK' . PHP_EOL;"
          fi
